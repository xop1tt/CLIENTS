<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F7BFF"/>
      <stop offset="0.55" stop-color="#5B3FF0"/>
      <stop offset="1" stop-color="#3A1C9E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3E6FF"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF6A3D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1B0B5A" flood-opacity="0.45"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <!-- магнит, раскрытый вправо вверх -->
  <g transform="rotate(45 512 512) translate(0 40)" filter="url(#soft)">
    <path d="M 392 330 V 520 A 120 120 0 0 0 632 520 V 330" fill="none" stroke="url(#metal)" stroke-width="112"/>
    <rect x="336" y="262" width="112" height="78" fill="url(#tip)"/>
    <rect x="576" y="262" width="112" height="78" fill="url(#tip)"/>
  </g>
  <!-- притягиваемые лиды -->
  <circle cx="700" cy="330" r="44" fill="#FFC857" filter="url(#soft)"/>
  <circle cx="782" cy="246" r="28" fill="#FFFFFF" fill-opacity="0.85"/>
  <circle cx="836" cy="190" r="16" fill="#FFFFFF" fill-opacity="0.55"/>
</svg>
