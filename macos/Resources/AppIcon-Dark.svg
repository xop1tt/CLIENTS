<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3A3E"/><stop offset="1" stop-color="#1C1C1E"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5CB6FF"/><stop offset="1" stop-color="#2A82F2"/></linearGradient>
    <linearGradient id="h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B8FF0"/><stop offset="1" stop-color="#1E62D0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A3A8A" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/></g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <g transform="translate(-58 22) rotate(-14 560 500)" filter="url(#lift)">
    <!-- ручка -->
    <path d="M 392 560 L 430 560 L 452 690 Q 456 712 434 716 L 418 718 Q 398 720 394 700 Z" fill="url(#h)"/>
    <!-- раструб -->
    <path d="M 318 448 L 612 318 Q 640 306 640 336 L 640 664 Q 640 694 612 682 L 318 552 Z" fill="url(#g)" stroke="url(#g)" stroke-width="28" stroke-linejoin="round"/>
    <!-- задняя часть -->
    <rect x="262" y="436" width="78" height="128" rx="30" fill="url(#h)"/>
    <!-- кромка раструба -->
    <rect x="626" y="300" width="56" height="400" rx="28" fill="url(#h)"/>
    <!-- звуковые волны -->
    <g fill="none" stroke="url(#g)" stroke-width="40" stroke-linecap="round">
      <path d="M 752 420 A 110 110 0 0 1 752 580"/>
      <path d="M 822 352 A 200 200 0 0 1 822 648"/>
    </g>
  </g>
</svg>