version: 2
updates:
  - package-ecosystem: github-actions   # обновляет закреплённые SHA действий
    directory: /
    schedule: {interval: weekly}
    labels: [dependencies]
    groups:
      actions: {patterns: ["*"], update-types: [minor, patch]}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    labels: [dependencies]
    groups:
      python: {patterns: ["*"], update-types: [minor, patch]}
