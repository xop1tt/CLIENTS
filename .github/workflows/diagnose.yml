name: Diagnose

on:
  workflow_dispatch:
    inputs:
      ping:
        description: "Проверить связь с Notion и Telegram (только в режиме live, отправит тестовое сообщение)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lead-search
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LEADGEN_MODE: ${{ vars.LEADGEN_MODE || 'dry-run' }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Restore encrypted state (read-only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/leadgen.db.enc
          key: leadgen-state-diagnose-${{ github.run_id }}
          restore-keys: leadgen-state-
      - name: Diagnose
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          INPUT_PING: ${{ inputs.ping }}
        run: |
          python -m leadgen state unpack
          if [[ "$INPUT_PING" == "true" ]]; then python -m leadgen diagnose --ping; else python -m leadgen diagnose; fi
