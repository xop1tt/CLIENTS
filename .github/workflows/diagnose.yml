name: Diagnose

on:
  workflow_dispatch:
    inputs:
      ping:
        description: "Проверить связь с Notion и Telegram (только в режиме live, отправит тестовое сообщение)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lead-search
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEADGEN_MODE: ${{ vars.LEADGEN_MODE || 'dry-run' }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Restore encrypted state (read-only)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: state/leadgen.db.enc
          key: leadgen-state-diagnose-${{ github.run_id }}
          restore-keys: leadgen-state-
      - name: Diagnose
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          INPUT_PING: ${{ inputs.ping }}
        run: |
          python -m leadgen state unpack
          if [[ "$INPUT_PING" == "true" ]]; then python -m leadgen diagnose --ping; else python -m leadgen diagnose; fi
