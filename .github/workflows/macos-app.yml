name: macOS app

on:
  push:
    paths: ["macos/**", ".github/workflows/macos-app.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos-app.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Стандартные раннеры (включая macOS) бесплатны для публичных репозиториев.
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: Tests (core)
        run: swift test

      - name: Build app
        env:
          UNIVERSAL: "1"
        run: ./scripts/build-app.sh build

      - name: Smoke test (launch)
        run: ./scripts/smoke-test.sh

      - name: Pack installer
        run: ./scripts/make-dmg.sh build/Lead-Generator-macOS.dmg

      - name: Upload app
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: Lead-Generator-macOS
          path: macos/build/Lead-Generator-macOS.dmg
          retention-days: 14
