name: macOS app

# Ветка PR собирается один раз (событие pull_request), main — после слияния.
on:
  push:
    branches: [main]
    paths: ["macos/**", ".github/workflows/macos-app.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos-app.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Новый коммит в ту же ветку отменяет устаревшую сборку.
concurrency:
  group: macos-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Стандартные раннеры (включая macOS) бесплатны для публичных репозиториев.
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      # Кэш сборки SwiftPM: повторные сборки компилируют только изменённое.
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: macos/.build
          key: spm-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('macos/Package.swift', 'macos/Package.resolved') }}-${{ hashFiles('macos/Sources/**', 'macos/Tests/**') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('macos/Package.swift', 'macos/Package.resolved') }}-

      - name: Tests (core)
        run: swift test

      - name: Build app
        env:
          # Универсальная сборка (arm64 + x86_64) — только для main; в PR хватает одной архитектуры.
          UNIVERSAL: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          # Облако: адрес проекта и ПУБЛИЧНЫЙ ключ из переменных репозитория (не секретов).
          # Не заданы — собирается версия только с локальными учётными записями.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: ./scripts/build-app.sh build

      - name: Smoke test (launch)
        run: ./scripts/smoke-test.sh

      - name: Pack installer
        run: ./scripts/make-dmg.sh build/Lead-Generator-macOS.dmg

      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lead-Generator-macOS
          path: macos/build/Lead-Generator-macOS.dmg
          retention-days: 14
