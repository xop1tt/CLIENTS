name: Release

# Релиз создаётся пушем тега вида v1.0.0 или вручную (Actions → Release → Run workflow):
# собирается приложение для macOS и прикрепляется к GitHub Release вместе с заметками
# из .github/release-notes/<тег>.md. При ручном запуске тег ставится на выбранный коммит ветки.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write # только для создания релиза и загрузки файла
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tests (core)
        working-directory: macos
        run: swift test

      - name: Build app
        working-directory: macos
        env:
          UNIVERSAL: "1"
          # Облако: адрес проекта и ПУБЛИЧНЫЙ ключ из переменных репозитория (не секретов).
          # Не заданы — собирается версия только с локальными учётными записями.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          export LEADGEN_VERSION="${TAG#v}"
          ./scripts/build-app.sh build
          ./scripts/smoke-test.sh
          ./scripts/make-dmg.sh "build/Lead-Generator-${TAG}-macOS.dmg"
          (cd build && shasum -a 256 "Lead-Generator-${TAG}-macOS.dmg" | tee "Lead-Generator-${TAG}-macOS.dmg.sha256")

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Неверный тег: $TAG" >&2; exit 1; fi
          files=("macos/build/Lead-Generator-${TAG}-macOS.dmg" "macos/build/Lead-Generator-${TAG}-macOS.dmg.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Релиз уже создан (например, через интерфейс GitHub): только прикладываем файлы.
            gh release upload "$TAG" "${files[@]}" --clobber
            exit 0
          fi
          notes=".github/release-notes/${TAG}.md"
          args=(--title "Lead Generator ${TAG#v}" --target "$GITHUB_SHA")
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          gh release create "$TAG" "${files[@]}" "${args[@]}"
