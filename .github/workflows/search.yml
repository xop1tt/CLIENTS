name: Lead search

on:
  schedule:
    # Каждый час в :23 (не в :00 — в начале часа очереди GitHub длиннее). Интервалы источников
    # задаются в config.example.yaml: запуск сам пропускает источники, которым ещё не пора.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Источники через запятую (пусто — все включённые)"
        required: false
        default: ""
      mode:
        description: "Режим запуска (live включается только переменной LEADGEN_MODE)"
        type: choice
        options: [default, dry-run, notion-only]
        default: default
      force:
        description: "Игнорировать интервалы источников"
        type: boolean
        default: false

# Минимальные права: только чтение кода. Кэш состояния работает без дополнительных прав.
permissions:
  contents: read

# Защита от одновременных запусков: новый запуск ждёт окончания текущего, а не отменяет его.
concurrency:
  group: lead-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # По умолчанию dry-run. Боевой режим: Settings → Secrets and variables → Actions → Variables → LEADGEN_MODE=live
      LEADGEN_MODE: ${{ vars.LEADGEN_MODE || 'dry-run' }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore encrypted state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/leadgen.db.enc
          key: leadgen-state-${{ github.run_id }}
          restore-keys: leadgen-state-

      - name: Decrypt state
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: python -m leadgen state unpack

      - name: Run search
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          INPUT_SOURCES: ${{ inputs.sources }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$INPUT_MODE" == "dry-run" || "$INPUT_MODE" == "notion-only" ]]; then
            export LEADGEN_MODE="$INPUT_MODE"
          fi
          export LAST_COMMIT_AT="$(git log -1 --format=%cI)"
          args=()
          if [[ -n "$INPUT_SOURCES" ]]; then
            [[ "$INPUT_SOURCES" =~ ^[A-Za-z0-9_,]+$ ]] || { echo "Некорректный список источников"; exit 2; }
            args+=(--sources "$INPUT_SOURCES")
          fi
          [[ "$INPUT_FORCE" == "true" ]] && args+=(--force)
          python -m leadgen run "${args[@]}"

      - name: Encrypt state
        if: always()
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: python -m leadgen state pack

      # Зашифрованная копия для desktop-приложения (macOS). Без STATE_ENCRYPTION_KEY файл не прочитать,
      # поэтому публикация артефакта в публичном репозитории не раскрывает лиды. Храним 3 дня.
      - name: Publish encrypted state for the desktop app
        if: always() && hashFiles('state/leadgen.db.enc') != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: leadgen-state
          path: state/leadgen.db.enc
          retention-days: 3
          if-no-files-found: ignore

      - name: Save encrypted state
        if: always() && hashFiles('state/leadgen.db.enc') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state/leadgen.db.enc
          key: leadgen-state-${{ github.run_id }}

      - name: Notify about workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_failure.py
