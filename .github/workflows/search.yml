name: Lead search

on:
  schedule:
    # Каждый час в :23 (не в :00 — в начале часа очереди GitHub длиннее). Интервалы источников
    # задаются в config.example.yaml: запуск сам пропускает источники, которым ещё не пора.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Источники через запятую (пусто — все включённые)"
        required: false
        default: ""
      force:
        description: "Игнорировать интервалы источников"
        type: boolean
        default: false

# Минимальные права: только чтение кода. Кэш состояния работает без дополнительных прав.
permissions:
  contents: read

# Защита от одновременных запусков: новый запуск ждёт окончания текущего, а не отменяет его.
concurrency:
  group: lead-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # По умолчанию dry-run. Боевой режим: Settings → Secrets and variables → Actions → Variables → LEADGEN_MODE=live
      LEADGEN_MODE: ${{ vars.LEADGEN_MODE || 'dry-run' }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore encrypted state
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: state/leadgen.db.enc
          key: leadgen-state-${{ github.run_id }}
          restore-keys: leadgen-state-

      - name: Decrypt state
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: python -m leadgen state unpack

      - name: Run search
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          INPUT_SOURCES: ${{ inputs.sources }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          export LAST_COMMIT_AT="$(git log -1 --format=%cI)"
          args=()
          if [[ -n "$INPUT_SOURCES" ]]; then
            [[ "$INPUT_SOURCES" =~ ^[A-Za-z0-9_,]+$ ]] || { echo "Некорректный список источников"; exit 2; }
            args+=(--sources "$INPUT_SOURCES")
          fi
          [[ "$INPUT_FORCE" == "true" ]] && args+=(--force)
          python -m leadgen run "${args[@]}"

      - name: Encrypt state
        if: always()
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: python -m leadgen state pack

      - name: Save encrypted state
        if: always() && hashFiles('state/leadgen.db.enc') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: state/leadgen.db.enc
          key: leadgen-state-${{ github.run_id }}

      - name: Notify about workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_failure.py
